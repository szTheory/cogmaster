# Pinned actions stay current without the owner. Minor and patch updates share
# one group, which the auto-merge workflow merges; majors stay separate pull
# requests, because a group that holds a major never qualifies for auto-merge.
# policy.dependabot checks the group name against that workflow.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
