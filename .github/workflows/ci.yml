# Continuous integration. Every job runs the same `cmake --workflow --preset`
# command as a local build, then checks that every test it expected ran. The
# ruleset requires one check, `CI required`. docs/testing.md describes the jobs.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build; empty builds the caller's commit"
        type: string
        required: false
        default: ""

# No trigger-level path filter: a workflow skipped by paths leaves the
# required check pending. The changes job decides what runs instead.

permissions:
  contents: read

# The instructions-per-frame gate reports only until two zero-spread control
# runs arm it; arming is one ci: pull request setting this to "gate".
env:
  COGMASTER_PERF_MODE: report
  # A published and deleted tag name can never be reused under immutable
  # releases, so every rehearsal attempt gets its own.
  REHEARSAL_TAG: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}

# Only a pull request's runs supersede each other, so every main commit keeps
# a result. The workflow name is part of the group because a call from
# release.yml sees the caller's context: its run must not queue behind the
# push run on the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # heavy=false only for a pull request whose every changed path, old and new
  # name, is under .planning/; then the heavy jobs are skipped.
  # release_inputs=true when a path the release pipeline reads changed.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional, seed value
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      release_inputs: ${{ steps.classify.outputs.release_inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      # A failed listing adds a path outside .planning/, so it counts as heavy;
      # CHANGED catches a listing cut short at the API's 3000 files.
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ -z "$NUMBER" ]; then
            printf 'heavy=true\nrelease_inputs=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          { gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' || echo '(listing failed)'; } |
            sh scripts/classify-changes.sh "$CHANGED" | tee -a "$GITHUB_OUTPUT"

  # The image has clang-format-21, clang-tidy-21 and jq; configure finds them.
  hygiene:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional, seed value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - run: cmake --workflow --preset hygiene
      - name: Every test ran
        run: cmake -DJUNIT=build/hygiene/junit.xml -DINVENTORY=tests/inventory/hygiene.txt -P tests/cmake/check_junit.cmake

  # The squash commit takes the pull request's title and body, so the check
  # reads them live: an edit reruns it (the edited trigger) without a commit.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional, seed value
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Conventional Commit title, no skip token
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body |
            sh scripts/check-title.sh "$title"

  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10  # provisional, seed value
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, preset: ci, os: linux, arch: x64 }
          - { runner: ubuntu-26.04-arm, preset: ci, os: linux, arch: arm64 }
          - { runner: macos-15, preset: ci, os: macos, arch: arm64 }
          - { runner: macos-15-intel, preset: ci, os: macos, arch: x64 }
          - { runner: windows-2025, preset: ci-msvc, os: windows, arch: x64 }
          - { runner: windows-11-arm, preset: ci-msvc, os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      # The MSVC developer environment for the runner's own architecture,
      # without a third-party action.
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV } }
      - name: Build, test, package
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/${{ matrix.preset }}/junit.xml -DINVENTORY=tests/inventory/ci.txt
          -DEXCLUDE=release -P tests/cmake/check_junit.cmake
      - name: Every release test ran
        run: >-
          cmake -DJUNIT=build/${{ matrix.preset }}/junit-release.xml -DINVENTORY=tests/inventory/ci.txt
          -DLABELS=release -P tests/cmake/check_junit.cmake
      # The README line installs this leg's own libretro zip after checking
      # its checksum, and refuses a copy with one byte flipped.
      - name: README install line
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        run: |
          cmake -DREADME=README.md "-DBASE_URL=file://$PWD/build/ci/" -P tests/cmake/install_line.cmake
          cmake -DREADME=README.md "-DBASE_URL=file://$PWD/build/ci/" -DFLIP=1 -P tests/cmake/install_line.cmake
      # The commit these archives were built from; a release publishes only
      # archives that all record its own commit.
      - name: The commit built
        run: git rev-parse HEAD > build/${{ matrix.preset }}/commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/${{ matrix.preset }}/cogmaster-*.zip
            build/${{ matrix.preset }}/commit.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/hashes.txt
          if-no-files-found: error

  asan:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # provisional, seed value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      # clang-21 is on the image; its sanitizer runtimes may not be.
      - name: Sanitizer runtimes
        run: dpkg -s libclang-rt-21-dev > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libclang-rt-21-dev; }
      - run: cmake --workflow --preset asan
      # The abi and release checks read binary shapes the instrumentation changes.
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/asan/junit.xml -DINVENTORY=tests/inventory/ci.txt
          "-DEXCLUDE=abi|release" -P tests/cmake/check_junit.cmake

  nofp:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: nofp (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5  # provisional, seed value
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - run: cmake --workflow --preset nofp
      - name: Every test ran
        run: cmake -DJUNIT=build/nofp/junit.xml -DINVENTORY=tests/inventory/nofp.txt -P tests/cmake/check_junit.cmake

  # 32-bit big-endian PowerPC under qemu-ppc: label portable, and its
  # hashes.txt joins the comparison.
  be32:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # provisional, seed value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Cross compiler and qemu-user
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-powerpc-linux-gnu g++-powerpc-linux-gnu qemu-user
      - run: cmake --workflow --preset be32
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/be32/junit.xml -DINVENTORY=tests/inventory/ci.txt
          -DLABELS=portable -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-be32
          path: build/be32/hashes.txt
          if-no-files-found: error

  # The same inputs give the same hashes everywhere: exactly seven files, the
  # six build legs and be32, byte-identical. wasm32 reports on its own.
  hash-equality:
    needs: [changes, build, be32]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional, seed value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*
          path: hashes
      - name: Hashes are byte-identical
        run: |
          rm -rf hashes/hashes-wasm32
          files=$(printf '%s;' hashes/*/hashes.txt)
          cmake "-DFILES=${files%;}" -DCOUNT=7 -DMODE=compare -P tests/cmake/hashes.cmake

  # Report-only: not in CI required's needs until it has a record on main.
  # Its comparison with Linux x64 prints the result and never fails the job.
  wasm32:
    needs: [changes, build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # provisional, seed value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
      - run: cmake --workflow --preset wasm32
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/wasm32/junit.xml -DINVENTORY=tests/inventory/wasm32.txt
          -DLABELS=portable -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-wasm32
          path: build/wasm32/hashes.txt
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hashes-linux-x64
          path: hashes-linux-x64
      - name: Same hashes as Linux x64 (report only)
        run: |
          if cmp hashes-linux-x64/hashes.txt build/wasm32/hashes.txt; then
            line="wasm32 hashes.txt equals Linux x64's"
          else
            line="wasm32 hashes.txt differs from Linux x64's"
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

  # A real frontend shows the same frame the runner hashes: RetroArch from
  # the pinned DMG runs the built core with no content, and its screenshot,
  # decoded by sips, equals the runner's frame pixel for pixel. A CI step,
  # not a CTest, so nothing skips itself off macOS.
  retroarch:
    needs: [changes, build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 5  # provisional, seed value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives-macos-arm64
          path: build/archives
      - name: Core and runner from the build
        run: |
          unzip -q build/archives/cogmaster-libretro-macos-arm64.zip -d build/libretro
          unzip -q build/archives/cogmaster-runner-macos-arm64.zip -d build/runner
      # fetch-pin.sh checks the DMG's SHA-256 before anything opens it.
      - name: RetroArch 1.22.2 from the pinned DMG
        run: |
          scripts/fetch-pin.sh retroarch-dmg build/dmg
          hdiutil attach build/dmg/RetroArch_Metal.dmg -nobrowse -readonly -mountpoint build/mount
          ditto build/mount/RetroArch.app build/RetroArch.app
          hdiutil detach build/mount
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/RetroArch.app/Contents/Info.plist)
          echo "RetroArch $version"
          test "$version" = 1.22.2
      - name: RetroArch runs the core with no content
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/cogmaster_libretro.dylib -DINFO=build/libretro/info/cogmaster_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra" -DFRAMES=60
          "-DSHOT=$PWD/build/frames/shot.png" -P tests/retroarch/run_retroarch.cmake
      - name: The screenshot equals the runner's frame
        working-directory: build/frames
        run: |
          ../runner/bin/cogmaster-run --frames 60 --png 60:runner.png
          for f in runner shot; do
            sips --deleteColorManagementProperties "$f.png" > /dev/null
            sips -s format bmp "$f.png" --out "$f.bmp" > /dev/null
          done
          cc -std=c17 -O2 -Wall -Wextra -Werror -o compare ../../tests/retroarch/bmp.c ../../tests/retroarch/compare.c
          ./compare runner.bmp shot.bmp | tee compare.txt
          grep -q '^256x192, every pixel equal$' compare.txt
      - name: The compare's negative control
        working-directory: build/frames
        run: >-
          cmake -DCOMPARE=./compare -DEXPECTED=shot.bmp -DBMP=runner.bmp -DFLIPPED=flipped.bmp
          -P ../../tests/retroarch/flip.cmake
      - name: RetroArch log
        if: failure()
        run: cat build/ra/retroarch.log || true

  # Cachegrind instructions per frame of the test card: the pull request's
  # head commit against its merge base with the base branch, the base
  # measured twice. The merge commit's first parent is not used: it is the
  # base branch tip, which also counts commits that landed after the branch
  # point. Direct runs only (a nested call passes ref). On workflow_dispatch
  # it measures one commit three times: a control run for arming the gate.
  perf:
    needs: changes
    if: ${{ !inputs.ref && needs.changes.outputs.heavy == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # provisional, seed value
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Cachegrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      # Both runners are copied to paths of equal length, so the path
      # Cachegrind and the loader see costs the same instructions. NO_BASE is
      # decided from the base tree's contents only: a base that has the bench
      # preset and fails to build fails this step.
      - name: Build the runner at head and base
        id: build
        run: |
          build() {
            (cd "$1" && cmake --workflow --preset bench) || return 1
            mkdir -p "$2" && cp "$1/build/bench/cogmaster-run" "$2/cogmaster-run"
          }
          build . "$RUNNER_TEMP/perf/head"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo no_base=none >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          echo "perf: head $HEAD_SHA, merge base $base"
          if git show "$base:CMakePresets.json" 2> /dev/null | grep -q '"name": "bench"'; then
            git worktree add --detach "$RUNNER_TEMP/base" "$base"
            build "$RUNNER_TEMP/base" "$RUNNER_TEMP/perf/base"
            echo no_base=false >> "$GITHUB_OUTPUT"
          else
            echo "perf: merge base $base has no bench preset; verdict NO_BASE"
            echo no_base=true >> "$GITHUB_OUTPUT"
          fi
      - name: Instructions per frame
        env:
          NO_BASE: ${{ steps.build.outputs.no_base }}
        run: |
          valgrind=$(command -v valgrind)
          # Ir of one run of the runner under $1 for $2 frames, from the
          # summary line of Cachegrind's output; empty output is a failure.
          ir() {
            rm -f "$RUNNER_TEMP/cg.out"
            env -i "$valgrind" --tool=cachegrind --cache-sim=no --cachegrind-out-file="$RUNNER_TEMP/cg.out" \
              "$1/cogmaster-run" --frames "$2" > /dev/null 2>&1 || return 1
            local v
            v=$(sed -n 's/^summary: *\([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/cg.out")
            [ -n "$v" ] || return 1
            echo "$v"
          }
          # Ir/frame = (Ir at 360 frames - Ir at 60) / 300, in integers.
          per_frame() {
            local a b
            a=$(ir "$1" 60) || return 1
            b=$(ir "$1" 360) || return 1
            echo $(( (b - a) / 300 ))
          }
          head=$(per_frame "$RUNNER_TEMP/perf/head")
          if [ "$NO_BASE" = none ]; then
            h2=$(per_frame "$RUNNER_TEMP/perf/head")
            h3=$(per_frame "$RUNNER_TEMP/perf/head")
            max=$head min=$head
            for v in "$h2" "$h3"; do
              if [ "$v" -gt "$max" ]; then max=$v; fi
              if [ "$v" -lt "$min" ]; then min=$v; fi
            done
            line="perf control testcard runs=$head,$h2,$h3 spread=$((max - min))"
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base1='' base2=''
          if [ "$NO_BASE" = false ]; then
            base1=$(per_frame "$RUNNER_TEMP/perf/base")
            base2=$(per_frame "$RUNNER_TEMP/perf/base")
          fi
          rc=0
          cmake -DROM=testcard "-DHEAD=$head" "-DBASE1=$base1" "-DBASE2=$base2" -DALLOW=tests/perf/allow.txt \
            "-DMODE=$COGMASTER_PERF_MODE" "-DTODAY=$(date -u +%Y-%m-%d)" "-DNO_BASE=$NO_BASE" \
            -P tests/cmake/perf_compare.cmake > perf.txt 2>&1 || rc=$?
          cat perf.txt
          grep '^perf ' perf.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

  # Every publish step of a release, rehearsed with the release App's token on
  # a same-repository pull request that changes a release input, against a
  # prerelease that is never latest: the 18 archives the build legs made from
  # the merge commit, SHA256SUMS, attestations that verify and a tampered copy
  # that does not, then the published release downloaded and checked. Direct
  # runs only (a nested call passes ref). A fork's pull request has no secrets
  # and skips it. docs/testing.md describes the rehearsal.
  rehearsal:
    needs: [changes, build]
    if: >-
      github.event_name == 'pull_request' && !inputs.ref &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.release_inputs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15  # provisional, seed value
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      # The merge commit the build legs checked out and recorded.
      EXPECTED_SHA: ${{ github.sha }}
      # The ref a pull_request run attests from, so a rehearsal's attestation
      # never passes for a release's; its signer is this file, not release.yml.
      SOURCE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
      SIGNER_WORKFLOW: ci.yml
    steps:
      - name: The release App is configured
        env:
          CLIENT_ID: ${{ vars.COGMASTER_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.COGMASTER_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "rehearsal: the release App is not configured: set COGMASTER_APP_CLIENT_ID and COGMASTER_APP_PRIVATE_KEY (scripts/setup-release-app.sh)"
            exit 1
          fi
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.COGMASTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.COGMASTER_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          path: artifacts
      # The zips side by side in dist, each leg's commit.txt under dist/legs/N.
      - name: The archives and each leg's commit
        run: |
          mkdir -p dist
          n=0
          for leg in artifacts/archives-*/; do
            n=$((n + 1))
            mkdir -p "dist/legs/$n"
            mv "${leg}commit.txt" "dist/legs/$n/"
            mv "$leg"cogmaster-*.zip dist/
          done
      - run: sh scripts/publish.sh prepare dist
      - id: draft
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          id=$(sh scripts/publish.sh rehearsal-create "$REHEARSAL_TAG")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: sh scripts/publish.sh upload "$REHEARSAL_TAG" "$ID" dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: sh scripts/publish.sh attested dist
      # By ID, as gh release edit --draft=false --prerelease --latest=false
      # would, but without looking the draft up by its tag.
      - name: Publish as a prerelease that is never latest
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F prerelease=true -f make_latest=false
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: sh scripts/publish.sh verify "$REHEARSAL_TAG" dist

  # Last, whatever the rehearsal did: its release and its tag go. A run
  # cancelled by a newer push can leave one uniquely named prerelease.
  cleanup:
    needs: rehearsal
    if: always() && needs.rehearsal.result != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional, seed value
    permissions:
      contents: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.COGMASTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.COGMASTER_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ needs.rehearsal.outputs.id }}
        run: sh scripts/publish.sh rehearsal-delete "$REHEARSAL_TAG" ${ID:+"$ID"}

  # The one required check. GitHub reports a skipped job as success and skips
  # a job whose dependency failed, so this always runs and requires every
  # result to be success, except: a heavy job skipped when changes said
  # heavy=false; title, perf, rehearsal and cleanup skipped outside pull
  # requests; perf, rehearsal and cleanup skipped in a nested call that
  # passes ref (release.yml's); and rehearsal and cleanup skipped when no
  # release input changed.
  ci-required:
    name: CI required
    if: always()
    needs: [changes, hygiene, title, build, asan, nofp, be32, hash-equality, retroarch, perf, rehearsal, cleanup]
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional, seed value
    steps:
      - name: Every job succeeded or was skipped as allowed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          CALLED: ${{ inputs.ref && 'true' || 'false' }}
          RELEASE_INPUTS: ${{ needs.changes.outputs.release_inputs }}
        run: |
          echo "$NEEDS" | jq -e --arg event "$EVENT" --arg heavy "$HEAVY" --arg called "$CALLED" --arg release_inputs "$RELEASE_INPUTS" 'to_entries | all(
            .value.result == "success"
            or (.key == "title" and .value.result == "skipped" and $event != "pull_request")
            or (.key == "perf" and .value.result == "skipped" and ($event != "pull_request" or $called == "true"))
            or ((.key | IN("rehearsal", "cleanup")) and .value.result == "skipped"
              and ($release_inputs != "true" or $event != "pull_request" or $called == "true"))
            or ($heavy == "false" and .value.result == "skipped" and (.key | IN("changes", "hygiene", "title") | not)))'
