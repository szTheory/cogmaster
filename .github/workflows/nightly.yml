# Nightly bench: 300,000 headless frames of the test card per platform, as
# trend data, never a gate (docs/testing.md, "Performance"), and libFuzzer
# over the loader and a two-frame run (docs/testing.md, "Fuzzing"). The runner
# reports its own frame-time percentiles and max_rss_kib. The vectors job
# runs the full z80 vector set (docs/conformance.md). Reports go to job
# summaries and artifacts, never to commits. A failed night opens or updates
# the one open issue labelled nightly; a good night closes it.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail the run on purpose, to show the nightly issue being written"
        type: boolean
        default: false
  # A change to the bench, the fuzz targets or this file runs the jobs on its
  # pull request; the report job writes no issue for pull requests.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - tests/fuzz/**
      - tests/z80/**
      - tests/vectors/**
      - runner/bench.c
      - runner/bench.h
      - runner/clock.c
      - runner/clock.h
      - runner/rss.c
      - runner/rss.h

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: bench (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3  # 2 x 62 s (macos-15), slowest of 3 runs, run 39335167849, provisional
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --workflow --preset bench
      # A report without the percentiles or the RSS line fails the job.
      - name: Bench 300,000 frames
        env:
          LABEL: ${{ matrix.runner }}
        run: |
          mkdir -p report
          build/bench/cogmaster-run --bench 300000 > report/bench.txt
          for key in p50_us p99.999_us max_us max_rss_kib; do
            grep -q "^$key [0-9]" report/bench.txt || { echo "bench: no $key line"; cat report/bench.txt; exit 1; }
          done
          { cat report/bench.txt; echo "runner $LABEL"; } > report/report.txt
          cat report/report.txt
          { echo "### bench $LABEL"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.runner }}
          path: report/report.txt
          if-no-files-found: error

  # The same bench under the pinned wasmtime, for the browser target. WASI
  # has no resident set size, so its max_rss_kib line reads 0.
  bench-wasm32:
    runs-on: ubuntu-26.04
    timeout-minutes: 3  # 2 x 82 s, slowest of 3 runs, run 39334762549, provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
      - name: Build the runner
        run: cmake --preset wasm32 && cmake --build --preset wasm32 --target cogmaster-run
      - name: Bench 300,000 frames
        run: |
          mkdir -p report
          build/pins/wasmtime/wasmtime run build/wasm32/cogmaster-run --bench 300000 > report/bench.txt
          { cat report/bench.txt; echo "runner wasm32-wasmtime"; } > report/report.txt
          cat report/report.txt
          { echo "### bench wasm32-wasmtime"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-wasm32
          path: report/report.txt
          if-no-files-found: error
      # After the upload, so a forced failure still leaves the night's data.
      - name: Forced failure
        if: inputs.force_failure
        run: exit 1

  # libFuzzer with the address and undefined-behaviour sanitizers, each target
  # 60 s from the generated seeds with -timeout=2 and -max_len=1049089. A
  # finding is triaged as a harness or core bug; its minimised input is
  # uploaded and joins tests/fuzz/regress with a manifest row.
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor (apt); 2 x 77 s, slowest of 2 runs, run 39375850717, provisional
    # Report-only until ten green nightly runs; then this line goes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # clang-21 is on the image; its sanitizer and libFuzzer runtimes may not be.
      - name: Sanitizer and libFuzzer runtimes
        run: dpkg -s libclang-rt-21-dev > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libclang-rt-21-dev; }
      - run: cmake --workflow --preset fuzz
      - name: Every test ran
        run: cmake -DJUNIT=build/fuzz/junit.xml -DINVENTORY=tests/inventory/fuzz.txt -DCHECK=check_junit -P tests/cmake/repository.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: build/fuzz/tests/fuzz-artifacts
          if-no-files-found: ignore

  # Every one of the 1,604,000 SingleStepTests z80 vectors at the pin, from
  # the archive fetch-pin.sh verifies, plus the check that the committed
  # sample is what the converter writes from that archive.
  vectors:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor (fetch); 2 x 67 s, slowest of 1 run, run 39376646150, provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/fetch-pin.sh sst-z80 build/pins/sst-z80
      - run: cmake --workflow --preset vectors-full
      - name: Every test ran
        run: cmake -DJUNIT=build/vectors-full/junit.xml -DINVENTORY=tests/inventory/vectors-full.txt -DCHECK=check_junit -P tests/cmake/repository.cmake

  # Decides from the jobs' results, never from a piped exit status: the
  # default shell has no pipefail.
  report:
    needs: [bench, bench-wasm32, fuzz, vectors]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional, 0 samples (skipped on pull requests)
    permissions:
      issues: write
    steps:
      - name: Rolling nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          results=$(jq -r 'to_entries | map("\(.key): \(.value.result)") | join(", ")' <<< "$NEEDS")
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "nightly: success ($results)"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Passed ($EVENT) at $SHA: $url"
            fi
            exit 0
          fi
          echo "nightly: failure ($results)"
          body="Failed ($EVENT) at $SHA: $url

          Jobs: $results"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly failed" --label nightly --body "$body"
          fi
